<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin IFCONS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
    <h1>Painel do Administrador</h1>

    <h2>avaliadors pendentes de aprovação</h2>
    <ul>
        {% for avaliador in avaliadors %}
        <li>
            {{ avaliador.nome }} - {{ avaliador.email }}
            <a href="{{ url_for('aprovar_avaliador', email=avaliador.email) }}" class="aprovar">Aprovar</a>
            <a href="{{ url_for('rejeitar_avaliador', email=avaliador.email) }}" class="rejeitar">Rejeitar</a>
        </li>
        {% endfor %}
    </ul>

    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
