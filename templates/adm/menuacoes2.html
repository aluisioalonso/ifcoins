<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Página do Aluno</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/adm/admin.css') }}">
</head>
<body>
    <header class="top-bar">
        <h1 class="titulo">Página do Admin</h1>

        <div class="perfil-menu">
            <a href="/admin/logout"  class="hamburger">Logout</a>
        </div>
    </header>

    <a>cadastrar nova ação</a>

   {% if acoes %}
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Valor</th>
                    <th>Descrição</th>
                </tr>
            </thead>
            <tbody>
                {% for acao in acoes %}
                <tr>
                    <td>{{ acao.id }}</td>
                    <td>{{ acao.nome }}</td>
                    <td>{{ acao.valor }}</td>
                    <td>{{ acao.descricao }}</td>
                    <td class="table-actions">
                        <a href="{{ url_for('pessoa.detalhes_pessoa', id=p.id_pessoa) }}" class="action-button view">Ver</a>
                        <a href="/admin/detalharacao/{{acao.id}}" class="action-button edit">Editar</a>
                        <form method="POST" action="{{ url_for('pessoa.excluir_pessoa', id=p.id_pessoa) }}" onsubmit="return confirm('Tem certeza que deseja excluir esta pessoa?');" style="display:inline;">
                            <button type="submit" class="action-button delete">Excluir</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <p class="empty-state">Nenhuma pessoa encontrada. <a href="{{ url_for('pessoa.cadastrar_pessoa') }}">Cadastre uma agora.</a></p>
    {% endif %}



    <script src="{{ url_for('static', filename='js/aluno.js') }}"></script>
</body>
</html>
