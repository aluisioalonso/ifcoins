<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Página do Aluno</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/aluno/aluno.css') }}">
</head>
<body>
    <header class="top-bar">
        <div class="saldo-box">IFCOINS: {{ aluno.saldo if aluno else '0.0' }}</div>
        <h1 class="titulo">Página do Aluno</h1>

        <div class="perfil-menu">
            <button onclick="toggleMenu()" class="hamburger">☰ Perfil</button>
            <div id="menu-opcoes" class="menu-opcoes hidden">
                <a href="{{ url_for('aluno.historico_acoes') }}">Histórico de Ações</a>
                <a href="{{ url_for('aluno.compras_disponiveis') }}">Compras Disponíveis</a>
                <button onclick="abrirModalPessoais()">Informações Pessoais</button>
                <a href="{{ url_for('logout') }}" class="logout-btn">Sair</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <button class="btn" onclick="abrirModal()">Inserir Ação</button>
        <a href="{{ url_for('aluno.compras_disponiveis') }}" class="btn">Retirar Recompensas</a>
        <a href="{{ url_for('aluno.historico_acoes') }}" class="btn">Histórico de Ações</a>
    </main>

    <!-- MODAL DE INSERIR AÇÃO -->
    <div id="modal" class="modal hidden">
        <div class="modal-content modal-grande">
            <span class="fechar" onclick="fecharModal()">&times;</span>
            <form action="{{ url_for('aluno.enviar_acao') }}" method="POST">
                <h2>Inserir Ação</h2>

                <label for="acao">Selecione a Ação:</label>
                <select id="acao" name="acao" required>
                    <option value="">*Escolha uma ação</option>
                    {% for acao in acoes %}
                    <option value="{{ acao.id }}">{{ acao.nome }} | Valor: ({{ acao.valor }} IFCOINS)</option>
                    {% endfor %}
                </select>

                <label for="mensagem">Descrição / Justificativa:</label>
                <textarea id="mensagem" name="mensagem" rows="4" placeholder="*Justificativa" required></textarea>

                <label for="link">Link ou URL do comprovante:</label>
                <input type="url" id="link" name="link" placeholder="https://exemplo.com/comprovante" required>


                <button type="submit" class="btn enviar-btn">Enviar</button>
            </form>
        </div>
    </div>

    <!-- MODAL DE INFORMAÇÕES PESSOAIS -->
    <div id="modal-pessoais" class="modal hidden">
            <div class="modal-content modal-grande">
            <span class="fechar" onclick="fecharModalPessoais()">&times;</span>
            <h2>Informações Pessoais</h2>
                <div class="info-pessoais">
                <div class="info-item"><strong>Nome:</strong> {{ aluno.nome }}</div>
                <div class="info-item"><strong>Email:</strong> {{ aluno.email }}</div>
                <div class="info-item"><strong>Senha:</strong> ********</div>
                <div class="info-item"><strong>Tipo de Usuário:</strong> Aluno</div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/aluno.js') }}"></script>
</body>
</html>
