<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu Principal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/avaliador/avaliador.css') }}">
</head>
<body>
  <main class="canvas">
    <div class="top-row">
      <button class="pill-profile" id="open-profile">Perfil</button>
    </div>

    <div class="title">Área do avaliador</div>

    <section class="actions-row">
      <a href="{{ url_for('avaliador.acoes_enviadas') }}" class="action-btn" id="btn-enviadas">
        Ações enviadas
      </a>

      <a href="{{ url_for('avaliador.acoes_deferidas') }}" class="action-btn" id="btn-deferidas">
        Ações deferidas
      </a>
    </section>
  </main>

  <!-- 🟩 MODAL DE PERFIL -->
  <div id="modal-perfil" class="modal hidden">
    <div class="modal-content">
      <span class="fechar" id="close-modal">&times;</span>
      <p><strong>Tipo de Usuário:</strong> Avaliador</p>

      <div class="perfil-links">
        <a href="{{ url_for('avaliador.acoes_enviadas') }}" class="btn">Ações Enviadas</a>
        <a href="{{ url_for('avaliador.acoes_deferidas') }}" class="btn">Ações Deferidas</a>
        <a href="{{ url_for('logout') }}" class="btn sair-btn">Sair</a>
      </div>
    </div>
  </div>

  <!-- 👇 O JS agora é carregado no final -->
  <script src="{{ url_for('static', filename='js/avaliador/avaliador.js') }}"></script>
</body>
</html>
