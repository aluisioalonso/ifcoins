<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ações para Avaliação</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/avaliador/acoes_enviadas.css') }}">
</head>
<body>

<div class="top-row-fixed">
    <a href="{{ url_for('avaliador.avaliador_pagina') }}" class="back-btn neon-btn">← Voltar</a>
    <button id="open-profile" class="pill-profile neon-btn">Perfil</button>
</div>

<!-- Modal de perfil -->
<div id="profile-modal" class="modal hidden">
    <div class="modal-content profile-modal-content">
        <h2>Perfil do Avaliador</h2>
        <a href="{{ url_for('avaliador.acoes_enviadas') }}" class="neon-btn modal-btn">Ações enviadas</a>
        <a href="{{ url_for('avaliador.acoes_deferidas') }}" class="neon-btn modal-btn">Ações deferidas</a>
        <a href="{{ url_for('logout') }}" class="neon-btn modal-btn">Sair</a>
        <button id="close-profile" class="neon-btn close-btn">Fechar</button>
    </div>
</div>

<main class="canvas">
    <div class="title">Ações Pendentes</div>

    {% if acoes|length == 0 %}
        <div class="empty-message">Nenhuma ação pendente de avaliação.</div>
    {% else %}
        {% for acao in acoes %}
            <div class="card horizontal-card">
                <form class="action-form horizontal-form" method="POST" action="{{ url_for('avaliador.aprovar_acao', id_acao=acao.id) }}">
                    <div class="form-group">
                        <label>Aluno:</label>
                        <input type="text" value="{{ acao.email_aluno }}" disabled>
                    </div>
                    <div class="form-group">
                        <label>ID:</label>
                        <input type="text" value="{{ acao.id }}" disabled>
                    </div>
                    <div class="form-group">
                        <label>Ação:</label>
                        <input type="text" value="{{ acao.acao.nome if acao.acao else 'Sem nome' }}" disabled>
                    </div>
                    <div class="form-group">
                        <label>Descrição:</label>
                        <textarea rows="2" disabled>{{ acao.comentarios_aluno or 'Sem descrição' }}</textarea>
                    </div>
                    {% if acao.link %}
                        <div class="form-group">
                            <label>Link enviado:</label>
                            <a href="{{ acao.link }}" target="_blank" class="mini-btn neon-btn">🔗 Abrir link</a>
                        </div>
                    {% endif %}

                    <div class="form-group">
                        <label>IFCoins:</label>
                        <input type="number" value="{{ acao.acao.valor if acao.acao else 0 }}" name="valor" disabled>
                    </div>
                    <div class="form-actions horizontal-buttons">

                        <a href="{{ url_for('avaliador.aprovar_acao', id_acao=acao.id) }}" class="pill-btn approve-btn neon-btn">Aprovar</a>
                        <a href="{{ url_for('avaliador.rejeitar_acao', id_acao=acao.id) }}" class="pill-btn reject-btn neon-red-btn">Rejeitar</a>
                    </div>
                </form>
            </div>
            <br>
        {% endfor %}
    {% endif %}
</main>

<script>
const openProfile = document.getElementById('open-profile');
const closeProfile = document.getElementById('close-profile');
const profileModal = document.getElementById('profile-modal');

openProfile.addEventListener('click', () => {
    profileModal.classList.remove('hidden');
});

closeProfile.addEventListener('click', () => {
    profileModal.classList.add('hidden');
});

window.addEventListener('click', (e) => {
    if(e.target === profileModal){
        profileModal.classList.add('hidden');
    }
});
</script>

</body>
</html>
