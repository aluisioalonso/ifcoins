<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página do Aluno</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/aluno.css') }}">
</head>
<body>
    <header>
        <div class="saldo">
            Saldo: <span>{{ aluno.saldo }} IFCoins</span>
        </div>
        <div class="perfil">
            {{ aluno.nome }}
            <img src="{{ url_for('static', filename='images/avatar.png') }}" alt="Perfil">
        </div>
    </header>

    <main>
        <div class="acoes-central">
            <h2>Registrar Ação</h2>
            <a href="{{ url_for('registrar_acao') }}" class="btn-central">Ir para Ações</a>
        </div>

        <div class="compras-disponiveis">
            <h2>Compras Disponíveis</h2>
            <div class="itens-compras">
                <div class="item-compra">
                    <h3>Viagem à praia</h3>
                    <p>Preço: 500 IFCoins</p>
                    <a href="{{ url_for('comprar_viagem') }}" class="btn-compra">Comprar</a>
                </div>
                <div class="item-compra">
                    <h3>Viagem à serra</h3>
                    <p>Preço: 300 IFCoins</p>
                    <a href="{{ url_for('comprar_viagem') }}" class="btn-compra">Comprar</a>
                </div>
                <!-- Mais itens podem ser adicionados aqui -->
            </div>
        </div>
    </main>
</body>
</html>
